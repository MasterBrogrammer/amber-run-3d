<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amber Run thumbnails</title>
  <style>
    body { margin: 24px; font-family: ui-sans-serif, system-ui, sans-serif; background: #120b1c; color: #fff6e8; }
    a { color: #f5b14d; }
    h1 { font-family: Georgia, serif; }
    section { margin: 28px 0; }
    .row { display: flex; flex-wrap: wrap; gap: 16px; }
    figure { margin: 0; width: min(320px, 100%); }
    img { width: 100%; height: auto; border-radius: 8px; background: #1a1028; display: block; }
    figcaption { font-size: 13px; margin-top: 6px; color: #f3e0c4; }
  </style>
</head>
<body>
  <p><a href="../">← Amber Run</a></p>
  <h1>Thumbnails</h1>
  <p>Right-click any image to save. Same files live in this folder.</p>

  <section>
    <h2>Original</h2>
    <div class="row">
      <figure>
        <a href="original-full.png"><img src="original-card.jpg" alt="Original card" /></a>
        <figcaption>
          <a href="original-full.png">full 1152×648</a> ·
          <a href="original-card.jpg">card 960×540</a> ·
          <a href="original-og.png">og 1200×630</a> ·
          <a href="original-square.png">square 640×640</a> ·
          <a href="original-thumb.jpg">thumb 480×270</a>
        </figcaption>
      </figure>
    </div>
  </section>

  <section>
    <h2>3D remake</h2>
    <div class="row">
      <figure>
        <a href="remake-full.png"><img src="remake-card.jpg" alt="Remake card" /></a>
        <figcaption>
          <a href="remake-full.png">full 1152×648</a> ·
          <a href="remake-card.jpg">card 960×540</a> ·
          <a href="remake-og.png">og 1200×630</a> ·
          <a href="remake-square.png">square 640×640</a> ·
          <a href="remake-thumb.jpg">thumb 480×270</a>
        </figcaption>
      </figure>
    </div>
  </section>
</body>
</html>
